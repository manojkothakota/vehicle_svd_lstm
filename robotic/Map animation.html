<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Platoon Movement - Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
  #map { height: 100%; width: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: white; padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); width: 300px;
  }
  #panel h3 { margin: 0 0 8px 0; font-size: 15px; }
  #controls { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  button {
    padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer;
    background: #1a73e8; color: white; font-size: 13px;
  }
  input[type=range] { flex: 1; }
  #timeLabel { font-size: 13px; margin-bottom: 8px; }
  #legend { max-height: 260px; overflow-y: auto; font-size: 12px; }
  .legend-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #333; flex-shrink: 0; }
  select { font-size: 13px; padding: 3px; }
</style>
</head>
<body>

<div id="panel">
  <h3>Platoon Live Movement</h3>
  <div id="controls">
    <button id="playBtn">Play</button>
    <select id="speedSel">
      <option value="1">1x</option>
      <option value="2" selected>2x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
    </select>
  </div>
  <input type="range" id="timeSlider" min="0" max="0" value="0" step="1">
  <div id="timeLabel">t = 0 s</div>
  <div id="legend"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = ["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd",
                 "#8c564b","#e377c2","#7f7f7f","#bcbd22","#17becf"];

let map, carMarkers = {}, animData = null;
let frameIdx = 0, playing = false, playTimer = null;

function initMap() {
  map = L.map('map').setView([16.43, 80.55], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  fetch('map_animation_data.json')
    .then(res => res.json())
    .then(data => {
      animData = data;
      setup(data);
    })
    .catch(err => {
      alert('Could not load map_animation_data.json. Make sure you are running this via "python -m http.server" in the same folder, and that platoon_simulation.py has been run.');
      console.error(err);
    });
}

function setup(data) {
  // draw the fixed route
  const routeLatLngs = data.path.map(p => [p.lat, p.lon]);
  L.polyline(routeLatLngs, { color: '#E6007E', weight: 4, opacity: 0.8 }).addTo(map);
  map.fitBounds(routeLatLngs);

  // create one marker per car using the first frame
  const firstFrame = data.frames[0];
  const legend = document.getElementById('legend');
  firstFrame.cars.forEach(car => {
    const color = COLORS[car.id % COLORS.length];
    const marker = L.circleMarker([car.lat, car.lon], {
      radius: 7, color: '#000', weight: 1, fillColor: color, fillOpacity: 1
    }).addTo(map);
    marker.bindTooltip(car.role === 'Leader' ? 'Leader' : `Car ${car.id}`, { permanent: false });
    carMarkers[car.id] = marker;

    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<span class="dot" style="background:${color}"></span>
                      <span id="legend-${car.id}">${car.role === 'Leader' ? 'Leader' : 'Car ' + car.id}: 0.0 m/s</span>`;
    legend.appendChild(row);
  });

  const slider = document.getElementById('timeSlider');
  slider.max = data.frames.length - 1;
  slider.addEventListener('input', () => {
    frameIdx = parseInt(slider.value);
    renderFrame(frameIdx);
  });

  document.getElementById('playBtn').addEventListener('click', togglePlay);

  renderFrame(0);
}

function renderFrame(idx) {
  const frame = animData.frames[idx];
  frame.cars.forEach(car => {
    const marker = carMarkers[car.id];
    if (marker) marker.setLatLng([car.lat, car.lon]);
    const label = document.getElementById(`legend-${car.id}`);
    if (label) {
      const name = car.role === 'Leader' ? 'Leader' : `Car ${car.id}`;
      label.textContent = `${name}: ${car.speed_mps.toFixed(1)} m/s`;
    }
  });
  document.getElementById('timeLabel').textContent = `t = ${frame.time_s.toFixed(0)} s`;
  document.getElementById('timeSlider').value = idx;
}

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('playBtn');
  btn.textContent = playing ? 'Pause' : 'Play';
  if (playing) {
    startPlayback();
  } else {
    clearInterval(playTimer);
  }
}

function startPlayback() {
  clearInterval(playTimer);
  playTimer = setInterval(() => {
    const speedMult = parseInt(document.getElementById('speedSel').value);
    frameIdx += speedMult;
    if (frameIdx >= animData.frames.length) {
      frameIdx = 0; // loop back to start
    }
    renderFrame(frameIdx);
  }, 150);
}

initMap();
</script>

</body>
</html>
